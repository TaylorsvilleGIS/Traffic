name: Update Traffic GeoJSON

permissions:
  contents: write

on:
  schedule:
    # Every 20 minutes from 6:07 AM through 8:47 PM Mountain Time.
    # America/Denver automatically accounts for daylight saving time.
    - cron: '7,27,47 6-20 * * *'
      timezone: 'America/Denver'

  workflow_dispatch:

jobs:
  update-geojson:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run conversion script
        env:
          tomtom_key: ${{ secrets.tomtom_key }}
        run: |
          python convert_to_geojson.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add traffic_data.geojson

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update traffic GeoJSON"
            git push origin main
          fi
